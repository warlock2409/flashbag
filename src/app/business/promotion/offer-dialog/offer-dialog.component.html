<div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col dialog-animate">

  <!-- Dialog Header -->
  <div class="flex justify-between items-center border-b border-gray-200 py-3 px-3">
    <h2 class="text-lg font-semibold text-gray-800 m-0">{{ isEditMode ? 'Edit Offer' : 'Add Offer' }}</h2>
    <button type="button" (click)="onCancel()" class="text-gray-400 hover:text-red-500 cursor-pointer">
      <i class="fa-solid fa-circle-xmark" style="color: lightcoral;"></i>
    </button>
  </div>

  <!-- Dialog Content -->
  <div class="flex-1 overflow-y-auto p-6">
    <form [formGroup]="offerForm" (ngSubmit)="onSubmit()" class="space-y-6">

      <!-- Basic Information -->
      <div>
        <h3 class="text-xl font-medium mb-4" style="color: #6d28d9;">Basic Information</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

          <!-- Offer Name -->
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Offer Name <span class="text-red-500">*</span>
            </label>
            <input type="text" autocomplete="off" formControlName="name" placeholder="e.g. New Customer Welcome Gift"
              class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-violet-400 focus:ring-violet-400 focus:outline-none" />
          </div>

          <!-- Description -->
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Description <span class="text-red-500">*</span>
            </label>
            <textarea formControlName="description" rows="2" placeholder="e.g. Get ₹100 off on your first purchase"
              class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-violet-400 focus:ring-violet-400 focus:outline-none"></textarea>
          </div>

        </div>
      </div>

      <!-- Pricing -->
      <div>
        <h3 class="text-xl font-medium mb-4" style="color: #6d28d9;">Pricing</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Discount Amount (₹) <span class="text-red-500">*</span>
            </label>
            <input type="number" formControlName="discountAmountRupees" min="1" placeholder="100"
              class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-violet-400 focus:ring-violet-400 focus:outline-none" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Min. Purchase (₹) <span class="text-red-500">*</span>
            </label>
            <input type="number" formControlName="minimumPurchaseRupees" min="0" placeholder="500"
              class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-violet-400 focus:ring-violet-400 focus:outline-none" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Gift Cost (₹) <span class="text-red-500">*</span>
            </label>
            <input type="number" formControlName="giftCostRupees" min="0" placeholder="100"
              class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-violet-400 focus:ring-violet-400 focus:outline-none" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Max Claims <span class="text-red-500">*</span>
            </label>
            <input type="number" formControlName="maximumRedemptions" min="1" placeholder="100"
              class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-violet-400 focus:ring-violet-400 focus:outline-none" />
          </div>

        </div>
      </div>

      <!-- Validity -->
      <div>
        <h3 class="text-xl font-medium mb-4" style="color: #6d28d9;">Validity</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Start Date <span class="text-red-500">*</span>
            </label>
            <input type="date" formControlName="startDateStr"
              class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-violet-400 focus:ring-violet-400 focus:outline-none" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              End Date <span class="text-red-500">*</span>
            </label>
            <input type="date" formControlName="endDateStr"
              class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-violet-400 focus:ring-violet-400 focus:outline-none" />
          </div>

        </div>
      </div>

      <!-- Eligibility -->
      <div>
        <h3 class="text-xl font-medium mb-4" style="color: #6d28d9;">Eligibility</h3>

        <label class="flex items-center mb-4">
          <input type="checkbox" formControlName="newCustomersOnly"
            class="h-4 w-4 text-violet-600 border-gray-300 rounded focus:ring-violet-400" />
          <span class="ml-2 text-gray-700">New customers only <span class="text-xs text-gray-500">(first-time shoppers)</span></span>
        </label>

        <label class="block text-sm font-medium text-gray-700 mb-2">
          Applicable industry segments <span class="text-red-500">*</span>
        </label>

        <div *ngIf="industriesLoading" class="text-xs text-gray-500">Loading segments...</div>
        <div *ngIf="industriesError" class="text-xs text-red-600">Could not load industry segments.</div>
        <div *ngIf="!industriesLoading && !industriesError && industrySegments.length === 0" class="text-xs text-gray-500">
          No industry segments available.
        </div>

        <div *ngIf="!industriesLoading && industrySegments.length > 0"
          class="grid grid-cols-1 sm:grid-cols-2 gap-2 p-4 bg-gray-100 rounded-md max-h-48 overflow-y-auto">
          <label *ngFor="let seg of industrySegments" class="flex items-center gap-2 text-sm text-gray-800 cursor-pointer">
            <input type="checkbox" class="h-4 w-4 text-violet-600 border-gray-300 rounded focus:ring-violet-400"
              [checked]="isSegmentSelected(seg.id)"
              (change)="toggleSegment(seg.id, $any($event.target).checked)" />
            <span>{{ seg.name }} <span class="text-xs text-gray-500">({{ seg.industryName }})</span></span>
          </label>
        </div>

        <span *ngIf="offerForm.get('industrySegmentIds')?.touched && offerForm.get('industrySegmentIds')?.invalid"
          class="block mt-2 text-xs text-red-600">Select at least one industry segment.</span>
      </div>

    </form>
  </div>

  <!-- Dialog Footer -->
  <div class="border-t border-gray-200 p-4 flex justify-end space-x-3">
    <div class="space-x-3 flex gap-2">
      <button type="button" (click)="onCancel()"
        class="rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
        Cancel
      </button>
      <button type="button" (click)="onSubmit()" [disabled]="offerForm.invalid"
        class="rounded-md px-4 py-2 text-sm font-medium text-white disabled:opacity-50 disabled:cursor-not-allowed"
        style="background-color: #a684ff;">
        {{ isEditMode ? 'Update Offer' : 'Create Offer' }}
      </button>
    </div>
  </div>

</div>
